<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Permitted Obstructions</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: white;
    }

    body {
      overflow-x: hidden;
    }

    .landing {
      position: relative;
      width: 100%;
    }

    /* SCROLLING IMAGE */
    .cover {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Second image underneath */
    .cover-2 {
      margin-top: 0;
    }

    /* Title */
    .label {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: -0.04em;

      color: #f4512a;
      mix-blend-mode: multiply;
    }

    /* ENTER BUTTON */
    .enter {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      z-index: 10;

      width: 90px;
      height: 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #f4512a;
      color: white;

      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.04em;

      transition: transform 0.2s ease,
                  background 0.2s ease;
    }

    .enter:hover {
      background: #f4512a;
      transform: translateX(-50%) scale(1.08);
    }
  </style>
</head>

<body>

  <main class="landing">

    

    <!-- First cover -->
    <img
      class="cover"
      src="cover-01.png"
      alt=""
    >

    <!-- Second cover continues below it -->
    <img
      class="cover cover-2"
      src="cover-02.png"
      alt=""
    >

    <a class="enter" href="subtract.html">
      ENTER
    </a>

  </main>

</body>
</html>
